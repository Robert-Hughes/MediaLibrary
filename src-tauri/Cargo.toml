[package]
name = "medialibrary-tauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# Embedded into the Nominatim User-Agent header (see
# `geocode::default_user_agent`). Nominatim's usage policy requires a
# real contact URL — keep this in sync with the canonical repo.
repository = "https://github.com/Robert-Hughes/MediaLibrary"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "medialibrary_tauri_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
walkdir = "2.5"
image = { version = "0.24", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp", "tiff"] }
base64 = "0.22"
rayon = "1.10"
kamadak-exif = "0.5"
log = "0.4"
quick-xml = "0.36"
dirs = "6"
# OpenAI image-description feature (see docs/IMAGE_ANALYSIS.md). rustls-tls
# avoids dragging in OpenSSL on Windows. multipart isn't needed — we send
# base64 image data inline in JSON.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
regex = "1"
async-trait = "0.1"
tempfile = "3.0"
trash = "5.2"


[dev-dependencies]
ts-rs = { version = "10", features = ["no-serde-warnings"] }
wiremock = "0.6"

[features]
default = []
# Integration tier: tests that exec real exiftool against image fixtures
# in `test_images/`. Run from the repo root with:
# `cargo test --manifest-path src-tauri/Cargo.toml --features integration`.
# See AGENTS.md for the tier policy.
integration = []

[profile.release]
strip = "debuginfo"

[profile.dev]
debug = 1
