<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Library</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #1e1e1e; color: #ccc; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      #splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 16px;
      }
      #splash .title { font-size: 18px; font-weight: 500; opacity: 0.9; }
      #splash .sub { font-size: 12px; opacity: 0.55; }
      #splash .spinner {
        width: 28px; height: 28px;
        border: 2px solid #444;
        border-top-color: #888;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      /* Hide splash once React has mounted something into #root */
      #root:not(:empty) + #splash { display: none; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div id="splash">
      <div class="spinner"></div>
      <div class="title">Media Library</div>
      <div class="sub">Loading…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
